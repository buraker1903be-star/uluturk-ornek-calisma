<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Sayfa bulunamadı — Ulutürk (örnek çalışma)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--void:#08090B;--bone:#EDEBE6;--fog:#8A9095;--brass:#B99B57;
  --hair:rgba(237,235,230,.11);--ease:cubic-bezier(.19,1,.22,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--void);color:var(--bone);
  font-family:"Jost",system-ui,sans-serif;font-weight:300;line-height:1.8;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(28px,7vw,80px);position:relative;overflow:hidden}
.rose{position:absolute;right:-18vw;top:50%;transform:translateY(-50%);
  width:min(100vh,860px);aspect-ratio:1;opacity:.32;pointer-events:none}
.rose g.spin{transform-origin:500px 500px;animation:spin 240s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.in{position:relative;z-index:2;max-width:640px}
.mark{font-family:"Cormorant Garamond",serif;font-size:25px;letter-spacing:.02em;
  line-height:1;margin-bottom:clamp(40px,9vh,90px);display:block;color:inherit;
  text-decoration:none}
.mark em{font-style:normal;display:block;font-family:"Jost",sans-serif;font-size:9px;
  letter-spacing:.3em;color:var(--fog);margin-top:4px}
.code{font-family:"Cormorant Garamond",serif;font-size:clamp(64px,14vw,150px);
  line-height:.9;color:var(--brass);margin-bottom:18px}
h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(26px,4.4vw,42px);
  line-height:1.1;margin:0 0 20px}
p{color:var(--fog);max-width:46ch;margin:0 0 38px}
a.back{display:inline-block;border:1px solid var(--brass);color:var(--brass);
  font-size:11px;letter-spacing:.2em;padding:14px 26px;text-decoration:none;
  transition:background .35s var(--ease),color .35s var(--ease)}
a.back:hover{background:var(--brass);color:var(--void)}
.foot{position:relative;z-index:2;margin-top:clamp(40px,9vh,90px);
  font-size:11.5px;letter-spacing:.06em;color:#5C6265;border-top:1px solid var(--hair);
  padding-top:20px;max-width:640px}
:focus-visible{outline:1px solid var(--brass);outline-offset:5px}
@media(prefers-reduced-motion:reduce){.rose g.spin{animation:none}}
</style>
</head>
<body>

<svg class="rose" viewBox="0 0 1000 1000" fill="none" aria-hidden="true">
  <g stroke="#B99B57" stroke-width="1" opacity=".26">
    <circle cx="500" cy="500" r="470"/><circle cx="500" cy="500" r="392"/>
    <circle cx="500" cy="500" r="250"/><circle cx="500" cy="500" r="120"/>
  </g>
  <g class="spin" stroke="#B99B57" stroke-width=".7" opacity=".2">
    <line x1="500" y1="30" x2="500" y2="970"/><line x1="30" y1="500" x2="970" y2="500"/>
    <line x1="168" y1="168" x2="832" y2="832"/><line x1="832" y1="168" x2="168" y2="832"/>
  </g>
  <g class="spin" opacity=".5">
    <path d="M500 250 L522 478 L750 500 L522 522 L500 750 L478 522 L250 500 L478 478 Z"
          fill="#B99B57" opacity=".13" stroke="#B99B57" stroke-width=".8"/>
  </g>
</svg>

<div class="in">
  <a class="mark" href="./">Ulutürk<em>ATTORNEY PARTNERSHIP</em></a>
  <div class="code">404</div>
  <h1>Aradığınız sayfa burada değil</h1>
  <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir. Ana sayfadan devam edebilirsiniz.</p>
  <a class="back" href="./">ANA SAYFAYA DÖN</a>
</div>

<div class="foot">ÖRNEK ÇALIŞMA — metinler temsilîdir.</div>

</body>
</html>
